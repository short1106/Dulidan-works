# Builds Glyph and Pixel for Windows on a Windows machine at GitHub and
# publishes them on the release page "Neueste Version" with fixed links:
#   .../releases/latest/download/Dulidan-Glyph.exe        (starts directly)
#   .../releases/latest/download/Dulidan-Glyph-Setup.exe  (installs)
#   .../releases/latest/download/Dulidan-Pixel.exe
#   .../releases/latest/download/Dulidan-Pixel-Setup.exe
#   .../releases/latest/download/Dulidan-Relay.exe
#   .../releases/latest/download/Dulidan-Relay-Setup.exe
#   .../releases/latest/download/Dulidan-Cortex.exe
#   .../releases/latest/download/Dulidan-Cortex-Setup.exe
name: Windows-Installer

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [glyph, pixel, relay, cortex]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Every build gets a higher version, so installed apps see that a new one exists.
      - name: Set version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --workspace @dulidan/${{ matrix.app }}

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build EXE files
        run: npm run dist:win --workspace @dulidan/${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: Dulidan-${{ matrix.app }}-Windows
          path: |
            apps/${{ matrix.app }}/release/*.exe
            apps/${{ matrix.app }}/release/${{ matrix.app }}.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish as "Neueste Version"
        run: |
          ls -la dist
          gh release delete neueste-version --yes --cleanup-tag || true
          gh release create neueste-version dist/*.exe dist/*.yml \
            --target "$GITHUB_SHA" \
            --title "Dulidan Works – neueste Version" \
            --latest \
            --notes "Automatisch gebaut aus Commit $GITHUB_SHA.

          **Direkt starten (ohne Installation):** Dulidan-Glyph.exe, Dulidan-Pixel.exe, Dulidan-Relay.exe, Dulidan-Cortex.exe
          **Installieren (mit Startmenü und Desktop-Symbol):** Dulidan-Glyph-Setup.exe, Dulidan-Pixel-Setup.exe, Dulidan-Relay-Setup.exe, Dulidan-Cortex-Setup.exe

          Die Dateien sind noch nicht digital signiert. Windows zeigt beim ersten Start
          „Der Computer wurde durch Windows geschützt“: Weitere Informationen → Trotzdem ausführen."
