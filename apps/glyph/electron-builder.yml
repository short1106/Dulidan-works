# Installer settings for Dulidan Glyph (electron-builder).
appId: de.dulidan.glyph
productName: Dulidan Glyph
copyright: Copyright © Dulidan Studios
directories:
  output: release
  buildResources: build
# Only the bundled app goes into the installer, no source code.
files:
  - out/**
  - package.json
extraFiles:
  - from: ../../THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
fileAssociations:
  - ext: glyph
    name: Glyph-Dokument
    description: Dulidan Glyph Dokument
    mimeType: application/x-dulidan-glyph
    icon: icon
    role: Editor
# Update feed: release file glyph.yml, read by the installed app (packages/core/src/electron/updater.ts).
publish:
  provider: github
  owner: short1106
  repo: Dulidan-works
  releaseType: release
  channel: glyph
win:
  target:
    # Setup with start menu and desktop shortcut ...
    - target: nsis
      arch: [x64]
    # ... and one EXE that starts directly, without installing.
    - target: portable
      arch: [x64]
  icon: build/icon.ico
portable:
  artifactName: Dulidan-Glyph.${ext}
nsis:
  # Classic setup with a choice of folder, no admin rights needed.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dulidan Glyph
  artifactName: Dulidan-Glyph-Setup.${ext}
  installerLanguages: [de_DE]
  language: '1031'
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target: dmg
linux:
  executableName: dulidan-glyph
  target: AppImage
  category: Office
  icon: build/icon.png
