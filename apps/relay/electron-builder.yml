# Installer settings for Dulidan Relay (electron-builder).
appId: de.dulidan.relay
productName: Dulidan Relay
copyright: Copyright © Dulidan Studios
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraFiles:
  - from: ../../THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
# Update feed: release file relay.yml, read by the installed app (packages/core/src/electron/updater.ts).
publish:
  provider: github
  owner: short1106
  repo: Dulidan-works
  releaseType: release
  channel: relay
win:
  target:
    # Setup with start menu and desktop shortcut ...
    - target: nsis
      arch: [x64]
    # ... and one EXE that starts directly, without installing.
    - target: portable
      arch: [x64]
  icon: build/icon.ico
portable:
  artifactName: Dulidan-Relay.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dulidan Relay
  artifactName: Dulidan-Relay-Setup.${ext}
  installerLanguages: [de_DE]
  language: '1031'
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target: dmg
linux:
  executableName: dulidan-relay
  target: AppImage
  category: Office
  icon: build/icon.png
