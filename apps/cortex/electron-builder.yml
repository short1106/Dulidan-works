# Installer settings for Dulidan Cortex (electron-builder).
appId: de.dulidan.cortex
productName: Dulidan Cortex
copyright: Copyright © Dulidan Studios
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraFiles:
  - from: ../../THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
win:
  target:
    # Setup with start menu and desktop shortcut ...
    - target: nsis
      arch: [x64]
    # ... and one EXE that starts directly, without installing.
    - target: portable
      arch: [x64]
  icon: build/icon.ico
portable:
  artifactName: Dulidan-Cortex.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dulidan Cortex
  artifactName: Dulidan-Cortex-Setup.${ext}
  installerLanguages: [de_DE]
  language: '1031'
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target: dmg
linux:
  executableName: dulidan-cortex
  target: AppImage
  category: Office
  icon: build/icon.png
